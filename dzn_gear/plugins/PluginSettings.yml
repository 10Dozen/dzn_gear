
# Provides powefull GUI tools to create kits.
Editor:
    UseACEArsenal: true

    UniformItemsOverride:
        Standard: '["<UNIFORM ITEMS    >> ",[UNIFORM_ITEMS]]'
        Leader: '["<UNIFORM ITEMS    >> ",[UNIFORM_ITEMS_L]]'

    AssignedItemsOverride:
        Standard: '["<ASSIGNED ITEMS   >> ", ASSIGNED_ITEMS]'
        Leader: '["<ASSIGNED ITEMS   >> ", ASSIGNED_ITEMS_L]'

    Roles:
        Platoon Leader: "pl"
        Squad Leader: "sl"
        Fireteam Leader: "ftl"
        Automatic Rifleman: "ar"
        Grenadier: "gr"
        Rifleman: "r"
        Section Leader: "sl"
        2IC: "2ic"
        Командир Взвода: "pl"

Notes:
    Personal:
        enable: true
        title: "Снаряжение"

    Group:
        enable: true
        title: "Снаряжение моей группы"
        refreshTime: 10         # refersh each 10 seconds
        refreshUntil: `5 * 60`  # 5 minutes after mission start

